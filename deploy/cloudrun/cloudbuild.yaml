# Build the Cloud Run image in Google's infrastructure rather than on a laptop.
#
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#     --substitutions=_IMAGE=europe-west9-docker.pkg.dev/$PROJECT/apps/rag:v1
#
# Two settings that are not decoration:
#   timeout   — the default is 10 minutes and this build indexes 2 634 extracts;
#               it WILL be killed at minute ten with a misleading error.
#   machineType — the ingestion is CPU-bound, and the default builder turns a
#               six-minute step into a twenty-minute one.
timeout: 3600s

options:
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/cloudrun/Dockerfile
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}
